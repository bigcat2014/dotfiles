background {
    monitor = HDMI-A-1
    path = ~/.config/backgrounds/BlackPanther.jpg
    blur_size = 14
    blur_passes = 3
}

background {
    monitor = DP-3
    path = ~/.config/backgrounds/IronMan.jpg
    blur_size = 14
    blur_passes = 3
}

input-field {
    monitor =
    font_family = Hurmit Nerd Font
    size = 20%, 5%

    font_color = rgb(dcdcdc)
    inner_color = rgba(00000000) # no fill
    outer_color = rgba(33ccffee)
    check_color=rgba(ffff66ee)
    fail_color=rgba(ff0055ee)

    fade_on_empty = false
    outline_thickness = 2
    rounding = 15

    halign = center
    valign = center

    placeholder_text = <i>Password</i>
}
